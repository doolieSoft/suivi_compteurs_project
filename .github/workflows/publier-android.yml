name: Publier l'application Android

# Pousser une étiquette « v… » suffit à produire la publication :
#
#     git tag v1.1 && git push origin v1.1
#
# Le déclenchement manuel reste possible depuis l'onglet Actions, utile pour
# rejouer une publication qui aurait échoué.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  # Nécessaire pour créer la publication et y attacher l'APK.
  contents: write

jobs:
  publier:
    runs-on: ubuntu-latest
    env:
      # Vide tant que le compte de service Google n'est pas déposé : l'envoi
      # au Play Store est alors sauté.
      PLAY_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4
        with:
          # Historique complet : les notes de version sont déduites des commits
          # écoulés depuis l'étiquette précédente.
          fetch-depth: 0

      - name: Installer Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Mettre Gradle en cache
        uses: gradle/actions/setup-gradle@v4

      - name: Restituer la clé de signature
        env:
          CLE_BASE64: ${{ secrets.CLE_ANDROID_BASE64 }}
          MOT_DE_PASSE: ${{ secrets.CLE_ANDROID_MOTDEPASSE }}
          ALIAS: ${{ secrets.CLE_ANDROID_ALIAS }}
        run: |
          if [ -z "$CLE_BASE64" ]; then
            echo "::error::Le secret CLE_ANDROID_BASE64 est absent."
            echo "Sans lui, la compilation retomberait sur la clé de débogage"
            echo "et produirait un APK qui ne pourrait pas mettre à jour"
            echo "l'application déjà installée."
            exit 1
          fi
          printf '%s' "$CLE_BASE64" | base64 -d > android/cle-release.jks
          cat > android/keystore.properties <<FIN
          motDePasseDepot=$MOT_DE_PASSE
          alias=$ALIAS
          motDePasseCle=$MOT_DE_PASSE
          FIN

      - name: Déterminer la version
        id: version
        run: |
          # L'étiquette donne le nom lisible, sans son « v » initial.
          if [ "${{ github.ref_type }}" = "tag" ]; then
            NOM="${GITHUB_REF_NAME#v}"
          else
            NOM="0.0-essai"
          fi
          echo "nom=$NOM" >> "$GITHUB_OUTPUT"
          # Le numéro d'exécution est un entier toujours croissant : Android
          # refuse d'installer un versionCode inférieur ou égal au précédent.
          # Décalé de 100 : des versions d'essai, installées par câble, ont
          # déjà porté les numéros 1 à 12.
          CODE=$(( ${{ github.run_number }} + 100 ))
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "Version $NOM (code $CODE)"

      - name: Lancer les tests
        working-directory: android
        # Les tests portent sur le code commun ; la variante libre doit au
        # moins compiler.
        run: ./gradlew testCompletDebugUnitTest assembleLibreDebug --console=plain

      - name: Construire l'APK signé
        working-directory: android
        run: |
          # Seule la version GitHub porte le lien de dons (variable LIEN_DONS
          # du dépôt) ; l'AAB du Play Store, construit ensuite, n'en a pas.
          ./gradlew assembleCompletRelease assembleLibreRelease --console=plain \
            -PsuiviVersionCode=${{ steps.version.outputs.code }} \
            -PsuiviVersionName=${{ steps.version.outputs.nom }} \
            -PsuiviLienDons="${{ vars.LIEN_DONS }}"

      - name: Construire l'AAB pour le Play Store
        working-directory: android
        run: |
          # Le Play Store n'accepte que ce format ; mêmes numéros que l'APK.
          ./gradlew bundleCompletRelease --console=plain \
            -PsuiviVersionCode=${{ steps.version.outputs.code }} \
            -PsuiviVersionName=${{ steps.version.outputs.nom }}

      - name: Vérifier la signature
        run: |
          SORTIES=android/app/build/outputs/apk
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort | tail -1)
          for APK in $SORTIES/complet/release/app-complet-release.apk $SORTIES/libre/release/app-libre-release.apk; do
            "$APKSIGNER" verify --print-certs "$APK" | tee signature.txt
            # Garde-fou : si le secret avait été mal restitué, la compilation
            # serait passée sans bruit sur la clé de débogage.
            if grep -q "CN=Android Debug" signature.txt; then
              echo "::error::$APK signé avec la clé de débogage, publication annulée."
              exit 1
            fi
          done
          cp $SORTIES/complet/release/app-complet-release.apk suivi-compteurs.apk
          # Sans lecture automatique de l'index : aucun composant propriétaire.
          cp $SORTIES/libre/release/app-libre-release.apk suivi-compteurs-libre.apk

      - name: Publier
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ETIQUETTE="${{ github.ref_name }}"
          if [ "${{ github.ref_type }}" != "tag" ]; then
            ETIQUETTE="essai-${{ github.run_number }}"
            git tag "$ETIQUETTE" && git push origin "$ETIQUETTE"
          fi
          gh release create "$ETIQUETTE" suivi-compteurs.apk suivi-compteurs-libre.apk \
            --title "$ETIQUETTE" \
            --generate-notes

      # Envoi au Play Store, seulement une fois le compte de service déposé
      # dans le secret PLAY_SERVICE_ACCOUNT_JSON : jusque-là, l'étape est
      # sautée et la publication GitHub fonctionne comme avant.
      #
      # Piste et statut se règlent par les variables du dépôt (onglet
      # Settings › Secrets and variables › Actions › Variables) :
      #   PLAY_PISTE  internal (défaut), alpha (test fermé), production…
      #   PLAY_STATUT draft (défaut, obligatoire tant que l'application n'a
      #               jamais été publiée), puis completed.
      - name: Envoyer au Play Store
        if: env.PLAY_JSON != '' && github.ref_type == 'tag'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: be.suivicompteurs.app
          releaseFiles: android/app/build/outputs/bundle/completRelease/app-complet-release.aab
          releaseName: ${{ steps.version.outputs.nom }}
          track: ${{ vars.PLAY_PISTE || 'internal' }}
          status: ${{ vars.PLAY_STATUT || 'draft' }}

      - name: Effacer la clé
        if: always()
        run: rm -f android/cle-release.jks android/keystore.properties
